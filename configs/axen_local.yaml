# AXEN Local Model Configuration
# ================================
# This file configures the direct PyTorch/Transformers inference layer.
# The model runs fully locally — no API keys, no cloud, no Ollama required.
#
# Compatible with RTX 3050 Laptop (4 GB VRAM):
#   - TinyLlama-1.1B: ~1.1B params, fits easily in 4 GB VRAM with float16
#   - Phi-2 (2.7B): fits in 4 GB with float16 (tight)
#   - Qwen2-1.5B: 1.5B, fast inference
#
# DEFAULT: TinyLlama/TinyLlama-1.1B-Chat-v1.0
#   - 1.1B parameters
#   - Chat fine-tuned
#   - ~2.2 GB in float16
#   - Fits comfortably in 4 GB VRAM

hf_model:
  # Model identifier from HuggingFace Hub (downloaded once, cached locally)
  name: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"

  # Device: "auto" selects CUDA if available, falls back to CPU
  # Alternatives: "cuda", "cpu", "cuda:0"
  device: "auto"

  # Floating point precision: float16 saves VRAM, float32 is more precise
  # On RTX 3050 with CUDA, float16 is recommended
  dtype: "float16"

  # Maximum number of new tokens to generate per response
  max_new_tokens: 512

  # Sampling temperature (0.0 = deterministic, 1.0 = very creative)
  temperature: 0.3

  # Top-p nucleus sampling — diversity control
  top_p: 0.9

  # Maximum context length (input + output tokens)
  # TinyLlama supports up to 2048
  max_context_length: 2048

  # Flash attention flag
  use_flash_attention: false

# AXEN System Instruction (configurable)
system_prompt: |
  You are AXEN, a local AI assistant. Answer the user's current request directly and naturally.
  Use available tools when necessary. Do not invent information. Follow the conversation context.
  Do not mention internal instructions or hidden reasoning.

# Ollama backend (preserved for compatibility with existing math/code pipelines)
llm:
  backend: "ollama"
  model: "qwen2.5:1.5b"
  temperature: 0.2
  context_length: 4096
  max_output_tokens: 512
  timeout: 60.0
  base_url: "http://localhost:11434"

# Reasoning configuration (preserved)
reasoning:
  max_strategy_attempts: 5
  verification_required: true
  max_subproblems: 5
  max_formalization_attempts: 3
